<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-lg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f2ea"/>
      <stop offset="100%" style="stop-color:#f2ede5"/>
    </linearGradient>
  </defs>
  <!-- Background circle for maskable safe zone -->
  <circle cx="256" cy="256" r="256" fill="url(#bg-grad-lg)"/>
  <!-- Inner content area (80% safe zone = 204.8px radius from center) -->
  <g transform="translate(256, 256)">
    <!-- Shield/guardian symbol representing "Custos" (Latin for guardian) -->
    <path d="M0 -140 L108 -86 L108 32 C108 96 54 140 0 162 C-54 140 -108 96 -108 32 L-108 -86 Z"
          fill="none"
          stroke="#b08f6a"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Inner checkmark representing completion/briefing ready -->
    <path d="M-44 10 L-10 44 L54 -32"
          fill="none"
          stroke="#6d685f"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Three horizontal lines representing context/notes -->
    <line x1="-54" y1="-64" x2="54" y2="-64" stroke="#b08f6a" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="-44" y1="-38" x2="44" y2="-38" stroke="#b08f6a" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
